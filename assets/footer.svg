<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Footer — Build systems that stay simple as they grow.">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.5" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#081520"/>
    </linearGradient>
    <linearGradient id="fRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fBorderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.12;0.35" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.25;0.08;0.25" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.15">
        <animate attributeName="stop-opacity" values="0.15;0.05;0.15" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="fScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.04" stroke-width="0.6"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="20s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="fGlowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fGlowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="fBlur" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>
    <clipPath id="fClip"><rect width="1200" height="140" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#fClip)">
    <!-- Background -->
    <rect width="1200" height="140" fill="url(#fBg)"/>
    <rect width="1200" height="140" fill="url(#fGrid)"/>

    <!-- Ambient glows -->
    <circle r="180" fill="url(#fGlowC)">
      <animate attributeName="cx" values="300;500;300" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;50;70" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="200" fill="url(#fGlowV)">
      <animate attributeName="cx" values="900;700;900" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;100;80" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- Scan -->
    <rect x="-300" y="0" width="300" height="140" fill="url(#fScan)">
      <animate attributeName="x" values="-300;1200" dur="10s" repeatCount="indefinite"/>
    </rect>

    <!-- Top rule with shimmer -->
    <rect x="250" y="2" width="700" height="2" fill="url(#fRule)" rx="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </rect>
    <!-- Shimmer on rule -->
    <rect x="250" y="2" width="80" height="2" fill="#ffffff" opacity="0" rx="1" filter="url(#fBlur)">
      <animate attributeName="x" values="250;950;250" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Main tagline -->
    <text x="600" y="68" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" letter-spacing="0.6">
      Build systems that stay simple as they grow.
    </text>

    <!-- Name line -->
    <text x="600" y="98" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#64748b" letter-spacing="3.5">
      BABLU DANGI  ·  FULL STACK &amp; AI ENGINEER
    </text>

    <!-- Bottom decorative dots -->
    <g>
      <circle cx="570" cy="120" r="2" fill="#67e8f9" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="590" cy="120" r="2" fill="#a78bfa" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <circle cx="610" cy="120" r="2" fill="#67e8f9" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="630" cy="120" r="2" fill="#a78bfa" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
    </g>
  </g>

  <!-- Animated border -->
  <rect x="0.5" y="0.5" width="1199" height="139" rx="20" fill="none" stroke="url(#fBorderGlow)" stroke-width="1.2"/>
</svg>
