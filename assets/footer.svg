<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="Footer — Build systems that stay simple as they grow.">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#030508"/>
      <stop offset="0.5" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="fRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#67e8f9" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.1;0.35" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.25;0.06;0.25" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.04;0.18" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="fScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fTextGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.15;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.1">
        <animate attributeName="stop-opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.15;0" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="fGA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fGB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="fGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.035" stroke-width="0.5"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="22s" repeatCount="indefinite"/>
    </pattern>

    <filter id="fBlur" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <filter id="fBlurSoft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <filter id="fPGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>

    <clipPath id="fClip"><rect width="1200" height="160" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#fClip)">
    <!-- Background -->
    <rect width="1200" height="160" fill="url(#fBg)"/>
    <rect width="1200" height="160" fill="url(#fGrid)"/>

    <!-- Starfield -->
    <g>
      <circle cx="80" cy="20" r="0.8" fill="#e2e8f0" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="45" r="0.6" fill="#e2e8f0" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <circle cx="350" cy="15" r="0.7" fill="#67e8f9" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="3.5s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="500" cy="50" r="0.5" fill="#e2e8f0" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
      </circle>
      <circle cx="680" cy="25" r="0.8" fill="#a78bfa" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
      </circle>
      <circle cx="820" cy="42" r="0.6" fill="#e2e8f0" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="3.8s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
      <circle cx="960" cy="12" r="0.7" fill="#67e8f9" opacity="0">
        <animate attributeName="opacity" values="0;0.55;0" dur="4.2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="1100" cy="38" r="0.5" fill="#e2e8f0" opacity="0">
        <animate attributeName="opacity" values="0;0.45;0" dur="3.6s" repeatCount="indefinite" begin="2.5s"/>
      </circle>
      <circle cx="150" cy="130" r="0.6" fill="#a78bfa" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
      <circle cx="450" cy="140" r="0.7" fill="#67e8f9" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0" dur="3.4s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="750" cy="135" r="0.5" fill="#e2e8f0" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="4.8s" repeatCount="indefinite" begin="1.8s"/>
      </circle>
      <circle cx="1050" cy="125" r="0.6" fill="#a78bfa" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="3.7s" repeatCount="indefinite" begin="2.2s"/>
      </circle>
    </g>

    <!-- Ambient glows -->
    <circle r="200" fill="url(#fGA)">
      <animate attributeName="cx" values="280;480;280" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;60;80" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="220" fill="url(#fGB)">
      <animate attributeName="cx" values="920;720;920" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;110;90" dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- Scan highlight -->
    <rect x="-300" y="0" width="300" height="160" fill="url(#fScan)">
      <animate attributeName="x" values="-300;1200" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- Top rule -->
    <rect x="200" y="2" width="800" height="2" fill="url(#fRule)" rx="1">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="5s" repeatCount="indefinite"/>
    </rect>
    <!-- Shimmer -->
    <rect x="200" y="1" width="60" height="4" fill="#ffffff" opacity="0" rx="2" filter="url(#fBlur)">
      <animate attributeName="x" values="200;1000;200" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Sparkle at rule ends -->
    <circle cx="200" cy="3" r="0" fill="#67e8f9" filter="url(#fPGlow)">
      <animate attributeName="r" values="0;4;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="3" r="0" fill="#a78bfa" filter="url(#fPGlow)">
      <animate attributeName="r" values="0;4;0" dur="5s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite" begin="2.5s"/>
    </circle>

    <!-- Holographic glow behind text -->
    <rect x="300" y="48" width="600" height="30" fill="url(#fTextGlow)" rx="15" filter="url(#fBlurSoft)"/>

    <!-- Main tagline -->
    <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1" letter-spacing="0.6">
      Build systems that stay simple as they grow.
    </text>

    <!-- Name line -->
    <text x="600" y="105" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#64748b" letter-spacing="3.5">
      BABLU DANGI  ·  FULL STACK &amp; AI ENGINEER
    </text>

    <!-- Waveform / equalizer visualization -->
    <g transform="translate(515 120)" fill="#67e8f9" opacity="0.3">
      <rect x="0" y="0" width="3" height="8" rx="1.5">
        <animate attributeName="height" values="4;12;4" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;0;4" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="8" y="2" width="3" height="6" rx="1.5" fill="#a78bfa">
        <animate attributeName="height" values="6;14;6" dur="1s" repeatCount="indefinite" begin="0.1s"/>
        <animate attributeName="y" values="2;-2;2" dur="1s" repeatCount="indefinite" begin="0.1s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1s" repeatCount="indefinite" begin="0.1s"/>
      </rect>
      <rect x="16" y="1" width="3" height="7" rx="1.5">
        <animate attributeName="height" values="3;10;3" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
        <animate attributeName="y" values="4;0;4" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.4s" repeatCount="indefinite" begin="0.2s"/>
      </rect>
      <rect x="24" y="0" width="3" height="8" rx="1.5" fill="#a78bfa">
        <animate attributeName="height" values="8;16;8" dur="0.9s" repeatCount="indefinite" begin="0.05s"/>
        <animate attributeName="y" values="0;-4;0" dur="0.9s" repeatCount="indefinite" begin="0.05s"/>
        <animate attributeName="opacity" values="0.2;0.55;0.2" dur="0.9s" repeatCount="indefinite" begin="0.05s"/>
      </rect>
      <rect x="32" y="2" width="3" height="6" rx="1.5" fill="#2dd4bf">
        <animate attributeName="height" values="5;11;5" dur="1.1s" repeatCount="indefinite" begin="0.15s"/>
        <animate attributeName="y" values="3;0;3" dur="1.1s" repeatCount="indefinite" begin="0.15s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.1s" repeatCount="indefinite" begin="0.15s"/>
      </rect>
      <rect x="40" y="1" width="3" height="7" rx="1.5">
        <animate attributeName="height" values="7;13;7" dur="1.3s" repeatCount="indefinite" begin="0.25s"/>
        <animate attributeName="y" values="1;-2;1" dur="1.3s" repeatCount="indefinite" begin="0.25s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.3s" repeatCount="indefinite" begin="0.25s"/>
      </rect>
      <rect x="48" y="3" width="3" height="5" rx="1.5" fill="#a78bfa">
        <animate attributeName="height" values="4;10;4" dur="1s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="y" values="4;1;4" dur="1s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1s" repeatCount="indefinite" begin="0.3s"/>
      </rect>
      <rect x="56" y="2" width="3" height="6" rx="1.5" fill="#2dd4bf">
        <animate attributeName="height" values="3;9;3" dur="1.2s" repeatCount="indefinite" begin="0.35s"/>
        <animate attributeName="y" values="4;1;4" dur="1.2s" repeatCount="indefinite" begin="0.35s"/>
        <animate attributeName="opacity" values="0.2;0.45;0.2" dur="1.2s" repeatCount="indefinite" begin="0.35s"/>
      </rect>
      <rect x="64" y="1" width="3" height="7" rx="1.5">
        <animate attributeName="height" values="5;12;5" dur="1.15s" repeatCount="indefinite" begin="0.4s"/>
        <animate attributeName="y" values="3;0;3" dur="1.15s" repeatCount="indefinite" begin="0.4s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.15s" repeatCount="indefinite" begin="0.4s"/>
      </rect>
      <rect x="72" y="2" width="3" height="6" rx="1.5" fill="#a78bfa">
        <animate attributeName="height" values="6;14;6" dur="0.95s" repeatCount="indefinite" begin="0.12s"/>
        <animate attributeName="y" values="2;-2;2" dur="0.95s" repeatCount="indefinite" begin="0.12s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="0.95s" repeatCount="indefinite" begin="0.12s"/>
      </rect>
      <rect x="80" y="3" width="3" height="5" rx="1.5">
        <animate attributeName="height" values="4;10;4" dur="1.25s" repeatCount="indefinite" begin="0.2s"/>
        <animate attributeName="y" values="4;1;4" dur="1.25s" repeatCount="indefinite" begin="0.2s"/>
        <animate attributeName="opacity" values="0.2;0.45;0.2" dur="1.25s" repeatCount="indefinite" begin="0.2s"/>
      </rect>
      <rect x="88" y="1" width="3" height="7" rx="1.5" fill="#2dd4bf">
        <animate attributeName="height" values="3;11;3" dur="1.35s" repeatCount="indefinite" begin="0.08s"/>
        <animate attributeName="y" values="4;0;4" dur="1.35s" repeatCount="indefinite" begin="0.08s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.35s" repeatCount="indefinite" begin="0.08s"/>
      </rect>
      <rect x="96" y="2" width="3" height="6" rx="1.5" fill="#a78bfa">
        <animate attributeName="height" values="5;12;5" dur="1.05s" repeatCount="indefinite" begin="0.28s"/>
        <animate attributeName="y" values="3;0;3" dur="1.05s" repeatCount="indefinite" begin="0.28s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.05s" repeatCount="indefinite" begin="0.28s"/>
      </rect>
      <rect x="104" y="0" width="3" height="8" rx="1.5">
        <animate attributeName="height" values="4;9;4" dur="1.4s" repeatCount="indefinite" begin="0.18s"/>
        <animate attributeName="y" values="4;1;4" dur="1.4s" repeatCount="indefinite" begin="0.18s"/>
        <animate attributeName="opacity" values="0.2;0.45;0.2" dur="1.4s" repeatCount="indefinite" begin="0.18s"/>
      </rect>
      <rect x="112" y="2" width="3" height="6" rx="1.5" fill="#2dd4bf">
        <animate attributeName="height" values="6;13;6" dur="1.1s" repeatCount="indefinite" begin="0.22s"/>
        <animate attributeName="y" values="2;-1;2" dur="1.1s" repeatCount="indefinite" begin="0.22s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.1s" repeatCount="indefinite" begin="0.22s"/>
      </rect>
      <rect x="120" y="3" width="3" height="5" rx="1.5" fill="#a78bfa">
        <animate attributeName="height" values="3;8;3" dur="1.3s" repeatCount="indefinite" begin="0.32s"/>
        <animate attributeName="y" values="4;2;4" dur="1.3s" repeatCount="indefinite" begin="0.32s"/>
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="1.3s" repeatCount="indefinite" begin="0.32s"/>
      </rect>
      <rect x="128" y="1" width="3" height="7" rx="1.5">
        <animate attributeName="height" values="5;11;5" dur="1.15s" repeatCount="indefinite" begin="0.38s"/>
        <animate attributeName="y" values="3;0;3" dur="1.15s" repeatCount="indefinite" begin="0.38s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.15s" repeatCount="indefinite" begin="0.38s"/>
      </rect>
      <rect x="136" y="2" width="3" height="6" rx="1.5" fill="#2dd4bf">
        <animate attributeName="height" values="4;10;4" dur="0.95s" repeatCount="indefinite" begin="0.42s"/>
        <animate attributeName="y" values="4;1;4" dur="0.95s" repeatCount="indefinite" begin="0.42s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="0.95s" repeatCount="indefinite" begin="0.42s"/>
      </rect>
      <rect x="144" y="0" width="3" height="8" rx="1.5" fill="#a78bfa">
        <animate attributeName="height" values="6;14;6" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
        <animate attributeName="y" values="2;-2;2" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
        <animate attributeName="opacity" values="0.2;0.55;0.2" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
      </rect>
      <rect x="152" y="2" width="3" height="6" rx="1.5">
        <animate attributeName="height" values="3;9;3" dur="1.35s" repeatCount="indefinite" begin="0.45s"/>
        <animate attributeName="y" values="4;1;4" dur="1.35s" repeatCount="indefinite" begin="0.45s"/>
        <animate attributeName="opacity" values="0.2;0.45;0.2" dur="1.35s" repeatCount="indefinite" begin="0.45s"/>
      </rect>
      <rect x="160" y="1" width="3" height="7" rx="1.5" fill="#2dd4bf">
        <animate attributeName="height" values="5;12;5" dur="1.05s" repeatCount="indefinite" begin="0.1s"/>
        <animate attributeName="y" values="3;0;3" dur="1.05s" repeatCount="indefinite" begin="0.1s"/>
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="1.05s" repeatCount="indefinite" begin="0.1s"/>
      </rect>
    </g>

    <!-- Edge light streaks -->
    <rect x="0" y="0" width="2" height="0" fill="#67e8f9" opacity="0" rx="1">
      <animate attributeName="y" values="0;160" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;40;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1198" y="160" width="2" height="0" fill="#a78bfa" opacity="0" rx="1">
      <animate attributeName="y" values="160;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="height" values="0;35;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
  </g>

  <!-- Animated border -->
  <rect x="0.5" y="0.5" width="1199" height="159" rx="20" fill="none" stroke="url(#fBorder)" stroke-width="1.2"/>
</svg>
