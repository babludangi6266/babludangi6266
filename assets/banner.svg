<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Bablu Dangi — Full Stack and AI Engineer">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="0.35" stop-color="#0a0f1e"/>
      <stop offset="0.65" stop-color="#0d1322"/>
      <stop offset="1" stop-color="#081520"/>
    </linearGradient>

    <!-- Name gradient with animation -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f9ff">
        <animate attributeName="stop-color" values="#f0f9ff;#e0f2fe;#f0f9ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#67e8f9">
        <animate attributeName="stop-color" values="#67e8f9;#a5f3fc;#67e8f9" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#c4b5fd;#a78bfa" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Underline rule -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow orbs -->
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#8b5cf6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern with drift -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="0.8" fill="#67e8f9" opacity="0.15"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="18s" repeatCount="indefinite"/>
    </pattern>

    <!-- Secondary grid for depth -->
    <pattern id="grid2" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#a78bfa" stroke-opacity="0.035" stroke-width="0.6"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-80 80" dur="26s" repeatCount="indefinite"/>
    </pattern>

    <!-- Scan line gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#67e8f9" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Border glow gradient -->
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.4">
        <animate attributeName="stop-opacity" values="0.4;0.15;0.4" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.3;0.1;0.3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.2;0.08;0.2" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Particle glow filter -->
    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>

    <clipPath id="round"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Base layers -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#grid2)"/>

    <!-- Ambient glow orbs with parallax motion -->
    <circle r="280" fill="url(#glowCyan)">
      <animate attributeName="cx" values="160;380;220;160" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;160;80;40" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="r" values="280;320;260;280" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="320" fill="url(#glowViolet)">
      <animate attributeName="cx" values="1060;840;960;1060" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;180;260;300" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="r" values="320;280;340;320" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="200" fill="url(#glowTeal)">
      <animate attributeName="cx" values="600;500;700;600" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="170;220;140;170" dur="22s" repeatCount="indefinite"/>
    </circle>

    <!-- Scanning highlight -->
    <rect x="-350" y="0" width="350" height="340" fill="url(#scanGrad)">
      <animate attributeName="x" values="-350;1200" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Floating particles -->
    <g filter="url(#particleGlow)">
      <circle r="1.5" fill="#67e8f9" opacity="0">
        <animate attributeName="cx" values="100;130;100" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;60;80" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="1" fill="#a78bfa" opacity="0">
        <animate attributeName="cx" values="300;280;300" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="280;310;280" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" repeatCount="indefinite" begin="0.8s"/>
      </circle>
      <circle r="1.2" fill="#67e8f9" opacity="0">
        <animate attributeName="cx" values="520;550;520" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="50;30;50" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
      <circle r="1.8" fill="#a78bfa" opacity="0">
        <animate attributeName="cx" values="720;700;720" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="300;270;300" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="4.2s" repeatCount="indefinite" begin="2s"/>
      </circle>
      <circle r="1" fill="#22d3ee" opacity="0">
        <animate attributeName="cx" values="200;220;200" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="180;160;180" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.65;0" dur="3.8s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <circle r="1.3" fill="#c4b5fd" opacity="0">
        <animate attributeName="cx" values="450;430;450" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;100;120" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0" dur="4.5s" repeatCount="indefinite" begin="3s"/>
      </circle>
    </g>

    <!-- Top meta line -->
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="2.2" fill="#64748b">
      <text x="72" y="70" opacity="0">
        PRODUCTION SYSTEMS  /  APPLIED AI  /  PLATFORM ENGINEERING
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze" begin="0.3s"/>
      </text>
    </g>

    <!-- Main name with fade-in -->
    <text x="72" y="154" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#nameGrad)" opacity="0">
      Bablu Dangi
      <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze" begin="0.6s"/>
    </text>

    <!-- Role subtitle -->
    <text x="74" y="196" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1" letter-spacing="0.4" opacity="0">
      Full Stack &amp; AI Engineer
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze" begin="1s"/>
    </text>

    <!-- Animated underline rule -->
    <rect x="74" y="216" width="120" height="2" fill="url(#rule)" rx="1">
      <animate attributeName="width" values="0;120;520;400;520" dur="8s" keyTimes="0;0.1;0.4;0.7;1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0.7;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <!-- Secondary shimmer on rule -->
    <rect x="74" y="216" width="60" height="2" fill="#ffffff" opacity="0" rx="1">
      <animate attributeName="x" values="74;594;74" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Stack line -->
    <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#7dd3fc" opacity="0">
      <text x="74" y="258">MERN  ·  Spring Boot  ·  RAG  ·  Vector Search</text>
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" begin="1.4s"/>
    </g>

    <!-- Blinking cursor -->
    <rect x="470" y="244" width="10" height="18" rx="1" fill="#67e8f9">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Status indicator dot -->
    <circle cx="74" cy="296" r="4" fill="#22c55e">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="88" y="300" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#64748b" letter-spacing="1" opacity="0">
      AVAILABLE FOR WORK
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" begin="1.8s"/>
    </text>

    <!-- ═══ RIGHT SIDE ARCHITECTURE DIAGRAM ═══ -->
    <g transform="translate(830 60)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze" begin="0.8s"/>

      <!-- Node boxes with individual pulse -->
      <rect x="0" y="0" width="130" height="48" rx="12" fill="none" stroke="#67e8f9" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="185" y="0" width="130" height="48" rx="12" fill="none" stroke="#a78bfa" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite" begin="0.5s"/>
      </rect>
      <rect x="92" y="115" width="130" height="48" rx="12" fill="none" stroke="#67e8f9" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.4;0.85;0.4" dur="5s" repeatCount="indefinite" begin="1s"/>
      </rect>
      <rect x="0" y="200" width="130" height="48" rx="12" fill="none" stroke="#a78bfa" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.5;0.95;0.5" dur="5s" repeatCount="indefinite" begin="1.5s"/>
      </rect>
      <rect x="185" y="200" width="130" height="48" rx="12" fill="none" stroke="#67e8f9" stroke-width="1.4">
        <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite" begin="2s"/>
      </rect>

      <!-- Faint box fills -->
      <rect x="1" y="1" width="128" height="46" rx="11" fill="#67e8f9" opacity="0.03"/>
      <rect x="186" y="1" width="128" height="46" rx="11" fill="#a78bfa" opacity="0.03"/>
      <rect x="93" y="116" width="128" height="46" rx="11" fill="#67e8f9" opacity="0.03"/>
      <rect x="1" y="201" width="128" height="46" rx="11" fill="#a78bfa" opacity="0.03"/>
      <rect x="186" y="201" width="128" height="46" rx="11" fill="#67e8f9" opacity="0.03"/>

      <!-- Connection lines -->
      <path d="M130 24H185" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-dasharray="4 5">
        <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M65 48V82H157V115" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-dasharray="4 5">
        <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite" begin="0.3s"/>
      </path>
      <path d="M250 48V82H157" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-dasharray="4 5">
        <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite" begin="0.6s"/>
      </path>
      <path d="M157 163V182H65V200" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-dasharray="4 5">
        <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite" begin="0.9s"/>
      </path>
      <path d="M157 182H250V200" fill="none" stroke="#94a3b8" stroke-opacity="0.3" stroke-dasharray="4 5">
        <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite" begin="1.2s"/>
      </path>

      <!-- Labels -->
      <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" text-anchor="middle" letter-spacing="1.4">
        <text x="65" y="29" fill="#94a3b8">CLIENT</text>
        <text x="250" y="29" fill="#94a3b8">API</text>
        <text x="157" y="144" fill="#94a3b8">SERVICES</text>
        <text x="65" y="229" fill="#94a3b8">VECTOR DB</text>
        <text x="250" y="229" fill="#94a3b8">LLM</text>
      </g>

      <!-- Data pulse particles — cyan -->
      <circle r="4" fill="#67e8f9" opacity="0.9" filter="url(#particleGlow)">
        <animate attributeName="cx" values="130;157;157;157" dur="3s" repeatCount="indefinite" keyTimes="0;0.3;0.6;1"/>
        <animate attributeName="cy" values="24;24;82;115" dur="3s" repeatCount="indefinite" keyTimes="0;0.3;0.6;1"/>
        <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="2;4;4;2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <!-- Data pulse — violet -->
      <circle r="4" fill="#a78bfa" opacity="0.9" filter="url(#particleGlow)">
        <animate attributeName="cx" values="157;157;65;65" dur="3.5s" repeatCount="indefinite" begin="1.5s" keyTimes="0;0.3;0.6;1"/>
        <animate attributeName="cy" values="163;182;182;200" dur="3.5s" repeatCount="indefinite" begin="1.5s" keyTimes="0;0.3;0.6;1"/>
        <animate attributeName="opacity" values="0;0.85;0.85;0" dur="3.5s" repeatCount="indefinite" begin="1.5s"/>
        <animate attributeName="r" values="2;4;4;2" dur="3.5s" repeatCount="indefinite" begin="1.5s"/>
      </circle>
      <!-- Data pulse — teal return path -->
      <circle r="3" fill="#2dd4bf" opacity="0" filter="url(#particleGlow)">
        <animate attributeName="cx" values="250;250;157" dur="4s" repeatCount="indefinite" begin="2.5s" keyTimes="0;0.4;1"/>
        <animate attributeName="cy" values="200;82;115" dur="4s" repeatCount="indefinite" begin="2.5s" keyTimes="0;0.4;1"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="4s" repeatCount="indefinite" begin="2.5s"/>
      </circle>
    </g>

    <!-- Corner accent lines -->
    <g stroke="#67e8f9" stroke-opacity="0.15" stroke-width="1">
      <line x1="30" y1="12" x2="30" y2="40">
        <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="12" y1="30" x2="40" y2="30">
        <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
      </line>
      <line x1="1170" y1="300" x2="1170" y2="328">
        <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite" begin="2s"/>
      </line>
      <line x1="1160" y1="310" x2="1188" y2="310">
        <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite" begin="2s"/>
      </line>
    </g>
  </g>

  <!-- Animated border -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="url(#borderGlow)" stroke-width="1.5"/>
</svg>
