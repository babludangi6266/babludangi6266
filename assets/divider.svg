<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32" role="presentation">
  <defs>
    <linearGradient id="dBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#67e8f9" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="0.75" stop-color="#67e8f9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dGlow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="dBlur" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5"/>
    </filter>
    <filter id="dBlur2" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Base line with pulse -->
  <rect x="0" y="15" width="1200" height="1" fill="url(#dBase)">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Glow trail — cyan, forward -->
  <rect x="0" y="11" width="140" height="10" rx="5" fill="url(#dGlow)" filter="url(#dBlur)">
    <animate attributeName="x" values="60;1000;60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Glow trail — violet, reverse -->
  <rect x="1000" y="11" width="100" height="10" rx="5" fill="url(#dGlow2)" filter="url(#dBlur)">
    <animate attributeName="x" values="1060;100;1060" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Main sliding pill — cyan -->
  <rect y="11" width="20" height="10" rx="5" fill="#67e8f9">
    <animate attributeName="x" values="80;1100;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;1;0.1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <!-- Core glow inside pill -->
  <rect y="13" width="10" height="6" rx="3" fill="#ffffff" opacity="0" filter="url(#dBlur2)">
    <animate attributeName="x" values="85;1105;85" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Second pill — violet, reverse -->
  <rect y="12" width="14" height="8" rx="4" fill="#a78bfa">
    <animate attributeName="x" values="1060;120;1060" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.75;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Third pill — teal, fast -->
  <rect y="13" width="8" height="6" rx="3" fill="#2dd4bf">
    <animate attributeName="x" values="200;1000;200" dur="4.5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4.5s" repeatCount="indefinite" begin="1s"/>
  </rect>

  <!-- Sparkle dots pulsing along the line -->
  <circle cx="150" cy="16" r="1.5" fill="#67e8f9" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="0.5;2;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="16" r="1.5" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite" begin="0.4s"/>
    <animate attributeName="r" values="0.5;2;0.5" dur="2.5s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle cx="450" cy="16" r="1.5" fill="#22d3ee" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="r" values="0.5;1.8;0.5" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle cx="600" cy="16" r="2" fill="#67e8f9" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" begin="1.2s"/>
    <animate attributeName="r" values="0.5;2.5;0.5" dur="1.8s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="750" cy="16" r="1.5" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.3s" repeatCount="indefinite" begin="1.6s"/>
    <animate attributeName="r" values="0.5;2;0.5" dur="2.3s" repeatCount="indefinite" begin="1.6s"/>
  </circle>
  <circle cx="900" cy="16" r="1.5" fill="#2dd4bf" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="2.6s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="r" values="0.5;1.8;0.5" dur="2.6s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="1050" cy="16" r="1.5" fill="#67e8f9" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="2.1s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="r" values="0.5;2;0.5" dur="2.1s" repeatCount="indefinite" begin="0.2s"/>
  </circle>

  <!-- Energy wave ripple from center -->
  <circle cx="600" cy="16" r="0" fill="none" stroke="#67e8f9" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="0;600" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="16" r="0" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="0;600" dur="5s" repeatCount="indefinite" begin="2.5s"/>
    <animate attributeName="opacity" values="0.25;0" dur="5s" repeatCount="indefinite" begin="2.5s"/>
    <animate attributeName="stroke-width" values="1;0.1" dur="5s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
</svg>
